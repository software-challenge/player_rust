name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Test default features (current active game)
        run: cargo test --locked --workspace --verbose

      - name: Test debug features
        run: cargo test --locked --workspace --features debug --verbose

  msrv:
    name: MSRV
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Cache cargo-msrv
        id: cache-cargo-msrv
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/cargo-msrv
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-msrv-v0.16.0

      - name: Install cargo-msrv
        if: steps.cache-cargo-msrv.outputs.cache-hit != 'true'
        run: cargo install cargo-msrv --version 0.16.0 --locked

      - name: Verify declared MSRV
        id: verify-msrv
        continue-on-error: true
        run: cargo msrv verify -- cargo test --locked --workspace --all-features

      - name: Find actual MSRV after verification failure
        if: ${{ steps.verify-msrv.outcome == 'failure' }}
        run: cargo msrv find -- cargo test --locked --workspace --all-features

      - name: Fail when declared MSRV is invalid
        if: ${{ steps.verify-msrv.outcome == 'failure' }}
        run: exit 1

  readme:
    name: README
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Check if README example code is identical to examples/basic_player/main.rs
        run: python3 .github/scripts/check_readme_example.py

      - name: Check if README and CONTRIBUTING version and edition markers match Cargo.toml
        run: python3 .github/scripts/check_version_and_edition.py

  release-metadata:
    name: Release metadata
    if: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check version bump and changelog entry
        run: |
          set -euo pipefail
          git fetch origin main --depth=1

          python3 - <<'PY'
          import re
          import subprocess
          from pathlib import Path

          def parse_version(cargo_text: str) -> str:
              match = re.search(r'(?ms)^\[package\]\s*\n(.*?)(?=^\[|\Z)', cargo_text)
              if match is None:
                  raise SystemExit('Could not find the [package] block in Cargo.toml.')

              version_match = re.search(r'(?m)^version\s*=\s*"([^"]+)"', match.group(1))
              if version_match is None:
                  raise SystemExit('Could not parse the package version from Cargo.toml.')

              return version_match.group(1)

          current_version = parse_version(Path('Cargo.toml').read_text(encoding='utf-8'))
          base_version = parse_version(
              subprocess.run(
                  ['git', 'show', 'origin/main:Cargo.toml'],
                  check=True,
                  capture_output=True,
                  text=True,
              ).stdout,
          )

          if current_version == base_version:
              raise SystemExit(
                  f'Cargo.toml version was not updated for the PR to main: {current_version} matches {base_version}.'
              )

          changelog = Path('CHANGELOG.md').read_text(encoding='utf-8')
          if not re.search(rf'(?m)^## \[{re.escape(current_version)}\]', changelog):
              raise SystemExit(
                  f'CHANGELOG.md does not contain an entry for version {current_version}.'
              )

          print(f'Version and changelog checks passed for {current_version}.')
          PY

  quality:
    name: Code quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust with Clippy
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Formatting (disabled until existing formatting is fixed)
        if: ${{ false }}
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --workspace --lib --tests -- -D warnings

  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build (debug)
        run: cargo build --locked --workspace --verbose

      - name: Build documentation
        run: cargo doc --locked --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  backend-assets:
    name: Backend assets check
    runs-on: ubuntu-24.04
    outputs:
      backend_available: ${{ steps.backend.outputs.backend_available }}
    steps:
      - uses: actions/checkout@v5

      - name: Download latest backend test assets
        id: backend
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/download_backend_assets.sh

      - name: Upload backend assets
        if: ${{ steps.backend.outputs.backend_available == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-assets
          path: ${{ runner.temp }}/backend
          if-no-files-found: error

      - name: Warning - backend assets unavailable for example integration tests
        if: ${{ steps.backend.outputs.backend_available != 'true' }}
        run: echo "::warning::Example integration tests were not run because the backend assets could not be downloaded or were incomplete."

  example-integration:
    name: Example integration test
    needs: backend-assets
    if: ${{ needs.backend-assets.outputs.backend_available == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Download backend test assets artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-assets
          path: ${{ runner.temp }}/backend

      - name: Run all examples against the test server
        env:
          SERVER_DIR: ${{ runner.temp }}/backend/server
          RANDOM_PLAYER_JAR: ${{ runner.temp }}/backend/randomplayer.jar
        run: bash .github/scripts/test_examples.sh
