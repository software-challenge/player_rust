name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Test default features
        run: cargo test --workspace --verbose

      - name: Test without default features
        run: cargo test --workspace --no-default-features --verbose

      - name: Test all features
        run: cargo test --workspace --all-features --verbose

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo-msrv
        id: cache-cargo-msrv
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-msrv
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-msrv-v0.16.0

      - name: Install cargo-msrv
        if: steps.cache-cargo-msrv.outputs.cache-hit != 'true'
        run: cargo install cargo-msrv --locked

      - name: Verify declared MSRV
        id: verify-msrv
        continue-on-error: true
        run: cargo msrv verify -- cargo test --workspace --all-features

      - name: Find actual MSRV after verification failure
        if: ${{ steps.verify-msrv.outcome == 'failure' }}
        run: cargo msrv find -- cargo test --workspace --all-features

      - name: Fail when declared MSRV is invalid
        if: ${{ steps.verify-msrv.outcome == 'failure' }}
        run: exit 1

  readme:
    name: README
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check if README example code is identical to examples/basic_player/main.rs
        run: python3 .github/scripts/check_readme_example.py

      - name: Check if README version and edition markers match Cargo.toml
        run: python3 .github/scripts/check_readme_version_and_edition.py

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust with Clippy
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Clippy
        run: cargo clippy --workspace --lib --tests -- -D warnings

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build (debug)
        run: cargo build --workspace --verbose

  example-integration:
    name: Example integration test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Download latest backend test assets
        id: backend
        shell: bash
        run: |
          set -euo pipefail

          release="$(curl --fail --silent --show-error --retry 3 \
            https://api.github.com/repos/software-challenge/backend/releases/latest)"
          server_url="$(jq -er '.assets[] | select(.name == "software-challenge-server.zip") | .browser_download_url' <<< "$release")"
          random_player_url="$(jq -er '.assets[] | select((.name | startswith("randomplayer-blokus-")) and (.name | endswith(".jar"))) | .browser_download_url' <<< "$release")"

          backend_dir="$RUNNER_TEMP/backend"
          mkdir -p "$backend_dir/server"
          curl --fail --location --silent --show-error --retry 3 "$server_url" \
            --output "$backend_dir/server.zip"
          curl --fail --location --silent --show-error --retry 3 "$random_player_url" \
            --output "$backend_dir/randomplayer.jar"
          unzip -q "$backend_dir/server.zip" -d "$backend_dir/server"

          server_jar="$(find "$backend_dir/server" -type f -name server.jar -print -quit)"
          if [[ -z "$server_jar" ]]; then
            echo "::error::The latest backend server archive did not contain server.jar."
            exit 1
          fi

          echo "server_dir=$(dirname "$server_jar")" >> "$GITHUB_OUTPUT"
          echo "random_player_jar=$backend_dir/randomplayer.jar" >> "$GITHUB_OUTPUT"

      - name: Run all examples against the test server
        env:
          SERVER_DIR: ${{ steps.backend.outputs.server_dir }}
          RANDOM_PLAYER_JAR: ${{ steps.backend.outputs.random_player_jar }}
        shell: bash
        run: |
          set -euo pipefail

          logs="$RUNNER_TEMP/example-integration-logs"
          mkdir -p "$logs"
          server_pid=
          random_player_pid=

          cleanup() {
            status=$?
            for pid in "$random_player_pid" "$server_pid"; do
              if [[ -n "$pid" ]]; then
                kill "$pid" 2>/dev/null || true
                wait "$pid" 2>/dev/null || true
              fi
            done
            if [[ "$status" -ne 0 ]]; then
              for log in "$logs"/*.log; do
                if [[ -f "$log" ]]; then
                  echo "::group::$(basename "$log")"
                  cat "$log"
                  echo "::endgroup::"
                fi
              done
            fi
          }
          trap cleanup EXIT

          (
            cd "$SERVER_DIR"
            java -Dfile.encoding=UTF-8 -Dlogback.configurationFile=logback.xml \
              -jar server.jar --port 13051
          ) > "$logs/server.log" 2>&1 &
          server_pid=$!

          server_ready=false
          for _ in {1..30}; do
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "::error::The backend test server exited before becoming ready."
              exit 1
            fi
            if grep -q "Listening on port 13051 for incoming connections." "$logs/server.log"; then
              server_ready=true
              break
            fi
            sleep 1
          done
          if [[ "$server_ready" != true ]]; then
            echo "::error::The backend test server did not listen on port 13051 within 30 seconds."
            exit 1
          fi

          mapfile -t examples < <(
            cargo metadata --no-deps --format-version 1 |
              jq -r --arg manifest "$GITHUB_WORKSPACE/Cargo.toml" \
                '.packages[] | select(.manifest_path == $manifest) | .targets[] | select(.kind | index("example")) | .name' |
              sort
          )
          if (( ${#examples[@]} == 0 )); then
            echo "::error::Cargo did not report any example targets to test."
            exit 1
          fi

          for example in "${examples[@]}"; do
            echo "::group::Testing example: $example"
            timeout --signal=TERM 240s java -jar "$RANDOM_PLAYER_JAR" --port 13051 \
              > "$logs/random-player-$example.log" 2>&1 &
            random_player_pid=$!

            timeout --signal=TERM 240s cargo run --all-features --example "$example" -- --port 13051 \
              > "$logs/$example.log" 2>&1
            wait "$random_player_pid"
            random_player_pid=

            cat "$logs/$example.log"
            echo "::endgroup::"
          done
