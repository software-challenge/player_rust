name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Test default features
        run: cargo test --workspace --verbose

      - name: Test without default features
        run: cargo test --workspace --no-default-features --verbose

      - name: Test all features
        run: cargo test --workspace --all-features --verbose

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo-msrv
        id: cache-cargo-msrv
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-msrv
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-msrv-v0.16.0

      - name: Install cargo-msrv
        if: steps.cache-cargo-msrv.outputs.cache-hit != 'true'
        run: cargo install cargo-msrv --locked

      - name: Verify declared MSRV
        id: verify-msrv
        continue-on-error: true
        run: cargo msrv verify -- cargo test --workspace --all-features

      - name: Find actual MSRV after verification failure
        if: ${{ steps.verify-msrv.outcome == 'failure' }}
        run: cargo msrv find -- cargo test --workspace --all-features

      - name: Fail when declared MSRV is invalid
        if: ${{ steps.verify-msrv.outcome == 'failure' }}
        run: exit 1

  readme:
    name: README
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check if README example code is identical to examples/basic_player/main.rs
        run: python3 .github/scripts/check_readme_example.py

      - name: Check if README minimum version and edition are identical to Cargo.toml
        run: python3 .github/scripts/check_readme_version_and_edition.py

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust with Clippy
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Clippy
        run: cargo clippy --workspace --lib --tests -- -D warnings

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build (debug)
        run: cargo build --workspace --verbose