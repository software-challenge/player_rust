name: Publish package and GitHub release

on:
  workflow_call:
    inputs:
      package_version:
        required: true
        type: string
      release_name:
        required: true
        type: string
      release_title:
        required: false
        type: string
      prerelease:
        required: false
        type: boolean
        default: false
      dry_run:
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-24.04
    environment: Release
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Generate release notes
        env:
          PACKAGE_VERSION: ${{ inputs.package_version }}
        run: |
          set -euo pipefail
          changelog_version="${PACKAGE_VERSION%%-nightly.*}"
          python3 .github/scripts/create_release_notes.py "$changelog_version" "$PACKAGE_VERSION"

      - name: Set package version
        env:
          PACKAGE_VERSION: ${{ inputs.package_version }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path('Cargo.toml')
          manifest = path.read_text(encoding='utf-8')
          match = re.search(r'(?ms)^\[package\]\s*\n(.*?)^(?=\[|\Z)', manifest)
          if match is None:
              raise SystemExit('Could not find the [package] block in Cargo.toml.')

          package = match.group(1)
          updated, count = re.subn(
              r'(?m)^version\s*=\s*"[^"]+"\s*$',
              f'version = "{os.environ["PACKAGE_VERSION"]}"',
              package,
              count=1,
          )
          if count != 1:
              raise SystemExit('Could not find the package version in Cargo.toml.')

          path.write_text(manifest[:match.start(1)] + updated + manifest[match.end(1):], encoding='utf-8')
          PY

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable

      - name: Update lockfile
        run: cargo check --workspace

      - name: Verify package
        if: ${{ !inputs.dry_run }}
        run: cargo publish --dry-run --locked --allow-dirty

      - name: Authenticate with crates.io
        if: ${{ !inputs.dry_run }}
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish crate
        if: ${{ !inputs.dry_run }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked --allow-dirty

      - name: Create GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          RELEASE_NAME: ${{ inputs.release_name }}
          RELEASE_TITLE: ${{ inputs.release_title || inputs.release_name }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          args=(--target "$GITHUB_SHA" --title "$RELEASE_TITLE" --notes-file release-notes.md)
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          gh release create "$RELEASE_NAME" "${args[@]}"
