name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate the release without publishing"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  validate:
    name: Validate release metadata
    needs: ci
    runs-on: ubuntu-24.04
    outputs:
      release_version: ${{ steps.metadata.outputs.release_version }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Require the main branch
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Releases must be started from the main branch."
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Check release metadata and unused targets
        id: metadata
        run: |
          set -euo pipefail
          release_version=$(python3 .github/scripts/check_release_metadata.py release --check-unused)
          echo "release_version=$release_version" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish release
    needs: validate
    uses: ./.github/workflows/publish.yml
    permissions:
      contents: write
      id-token: write
    with:
      package_version: ${{ needs.validate.outputs.release_version }}
      release_name: v${{ needs.validate.outputs.release_version }}
      release_title: v${{ needs.validate.outputs.release_version }}
      prerelease: false
      dry_run: ${{ inputs.dry_run }}
