name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (season.breaking.fixes, for example 27.0.6)"
        required: true
        type: string
      dry_run:
        description: "Validate the release without committing or publishing"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  release:
    name: Check and publish
    needs: ci
    runs-on: ubuntu-latest
    environment: Release
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Require the main branch
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Releases must be started from the main branch."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Check that the version is valid and unused
        run: |
          python3 - <<'PY'
          import os
          import re
          import urllib.error
          import urllib.request

          version = os.environ["RELEASE_VERSION"]
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version):
              raise SystemExit("Version must contain exactly three numeric parts, such as 27.0.6.")

          crate_url = f"https://crates.io/api/v1/crates/socha/{version}"
          request = urllib.request.Request(crate_url, headers={"User-Agent": "player_rust-release"})
          try:
              urllib.request.urlopen(request, timeout=20)
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise SystemExit(f"Could not check crates.io (HTTP {error.code}).")
          except Exception as error:
              raise SystemExit(f"Could not check crates.io: {error}")
          else:
              raise SystemExit(f"socha {version} is already published on crates.io.")

          repository = os.environ["GITHUB_REPOSITORY"]
          tag_url = f"https://api.github.com/repos/{repository}/git/ref/tags/v{version}"
          token = os.environ["GH_TOKEN"]
          request = urllib.request.Request(
              tag_url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          try:
              urllib.request.urlopen(request, timeout=20)
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise SystemExit(f"Could not check GitHub tag (HTTP {error.code}).")
          except Exception as error:
              raise SystemExit(f"Could not check GitHub tag: {error}")
          else:
              raise SystemExit(f"GitHub tag v{version} already exists.")
          PY

      - name: Update package version
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("Cargo.toml")
          manifest = path.read_text()
          match = re.search(r"(?ms)^\[package\]\s*\n(.*?)(?=^\[|\Z)", manifest)
          if match is None or not re.search(r'(?m)^name\s*=\s*"socha"\s*$', match.group(1)):
              raise SystemExit("Could not find the socha package metadata in Cargo.toml.")

          package = match.group(1)
          current = re.search(r'(?m)^version\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+)"\s*$', package)
          if current is None:
              raise SystemExit("Could not read the current package version from Cargo.toml.")
          if tuple(map(int, os.environ["RELEASE_VERSION"].split("."))) < tuple(map(int, current.group(1).split("."))):
              raise SystemExit(f"Version {os.environ['RELEASE_VERSION']} must not be lower than {current.group(1)}.")

          updated, count = re.subn(
              r'(?m)^version\s*=\s*"[^"]+"\s*$',
              f'version = "{os.environ["RELEASE_VERSION"]}"',
              package,
              count=1,
          )
          if count != 1:
              raise SystemExit("Could not find the package version in Cargo.toml.")

          path.write_text(manifest[:match.start(1)] + updated + manifest[match.end(1):])
          PY

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable

      - name: Update lockfile for release version
        run: cargo check --workspace

      - name: Verify package
        run: cargo publish --dry-run --locked --allow-dirty

      - name: Prepare release notes
        run: python3 .github/scripts/create_release_notes.py "$RELEASE_VERSION"

      - name: Authenticate with crates.io
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Commit version update
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          if ! git diff --cached --quiet; then
            git commit -m "chore: release socha $RELEASE_VERSION"
            git push origin HEAD:refs/heads/main
          fi
          echo "RELEASE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Publish crate
        if: ${{ !inputs.dry_run }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked

      - name: Create GitHub release
        if: ${{ !inputs.dry_run }}
        run: |
          gh release create "v$RELEASE_VERSION" \
            --target "$RELEASE_COMMIT" \
            --title "v$RELEASE_VERSION" \
            --notes-file release-notes.md
