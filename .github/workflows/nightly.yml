name: Nightly

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Force a nightly publish even when no code changes are detected."
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  prepare:
    name: Detect and validate nightly
    needs: ci
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.detect.outputs.publish }}
      date: ${{ steps.detect.outputs.date }}
      package_version: ${{ steps.metadata.outputs.package_version }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Detect whether there is anything new since the last release
        id: detect
        run: |
          set -euo pipefail
          git fetch --tags --force

          changed=false
          for tag in $(git tag --list 'v*' --list 'nightly-*' --sort=-creatordate); do
            if ! git diff --quiet "$tag..HEAD"; then
              changed=true
              break
            fi
          done

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            changed=true
          fi

          echo "publish=$changed" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Skip nightly publish when nothing changed
        if: ${{ steps.detect.outputs.publish != 'true' }}
        run: echo "No changes since the last real or nightly release; skipping nightly publication."

      - name: Check nightly metadata and write release notes
        if: ${{ steps.detect.outputs.publish == 'true' }}
        id: metadata
        env:
          NIGHTLY_DATE: ${{ steps.detect.outputs.date }}
        run: |
          set -euo pipefail
          package_version=$(python3 .github/scripts/check_release_metadata.py nightly --nightly-date "$NIGHTLY_DATE" --check-unused)
          echo "package_version=$package_version" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish nightly release
    needs: prepare
    if: ${{ needs.prepare.outputs.publish == 'true' }}
    uses: ./.github/workflows/publish.yml
    with:
      package_version: ${{ needs.prepare.outputs.package_version }}
      release_name: nightly-${{ needs.prepare.outputs.date }}
      release_title: nightly-${{ needs.prepare.outputs.date }}
      prerelease: true
      dry_run: false
