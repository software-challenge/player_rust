[package]
name = "socha"
version = "27.0.2"
license = "Apache-2.0"
description = "Offiziele Rust Bibliothek der Software Challenge Germany"
repository = "https://github.com/software-challenge/player_rust"
readme = "README.md"
keywords = ["socha", "software-challenge"]
edition = "2024"
exclude = [
    ".github/",
    "target/",
    "shell.nix",
    "connection_reads.log",
]

[dependencies]
xml = "1.4.0"
quick-xml = {version = "0.42.0", features = ["serialize"]}
serde = {version = "1.0.229", features = ["derive"]}
criterion = { version = "0.8.2", features = ["html_reports"] }

[features]
debug = ["debug-recv-comm-log"]
debug-recv-comm-log = []

[lints.clippy]
unwrap_used = "warn"
exprect_used = "warn"
indexing_slicing = "warn"
panic = "warn"

[[bench]]
name = "xml_bench"
harness = false